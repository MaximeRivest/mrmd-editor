<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mrmd - Document Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; }
    }

    /* Document page - like Word/GDocs */
    .document {
      width: 100%;
      max-width: 816px;      /* US Letter width at 96dpi */
      min-height: 1056px;    /* US Letter height at 96dpi */
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 96px 96px;    /* 1 inch margins */
    }

    @media (prefers-color-scheme: dark) {
      .document {
        background: #282c34;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
    }

    /* Editor fills the document */
    .document .cm-editor {
      height: 100%;
    }
  </style>
</head>
<body>

<div class="document" id="editor"></div>

<script src="./dist/mrmd.iife.js"></script>
<script>
  const editor = mrmd.create('#editor', {
    doc: `# Welcome to mrmd

A clean, document-style markdown editor.

## Getting Started

Just start typing. The editor supports **bold**, *italic*, and all standard markdown.

## Code Blocks

\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

## Lists

- First item
- Second item
- Third item

---

*Built with CodeMirror 6 and Yjs*
`
  });

  window.editor = editor;
  window.mrmd = mrmd;
</script>

</body>
</html>
