<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mrmd</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --sidebar-width: 220px; color-scheme: light dark; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: light-dark(#ffffff, #1e1e1e);
      color: light-dark(#1a1a1a, #e0e0e0);
    }

    .app { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: light-dark(#f8f8f8, #252526);
      border-right: 1px solid light-dark(#e0e0e0, #3c3c3c);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: light-dark(#666, #888);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid light-dark(#e0e0e0, #3c3c3c);
    }

    .sidebar-header button {
      background: none;
      border: none;
      color: light-dark(#666, #888);
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .sidebar-header button:hover {
      background: light-dark(#e8e8e8, #3c3c3c);
    }

    .file-list { flex: 1; overflow-y: auto; }

    .file-item {
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-left: 3px solid transparent;
    }

    .file-item:hover { background: light-dark(#e8e8e8, #2d2d2d); }
    .file-item.active {
      background: light-dark(#e0e0e0, #37373d);
      border-left-color: light-dark(#2563eb, #4f9eff);
    }

    /* Main area - Studio will fill this */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    /* Header above studio */
    .header {
      height: 40px;
      background: light-dark(#f8f8f8, #252526);
      border-bottom: 1px solid light-dark(#e0e0e0, #3c3c3c);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      color: light-dark(#2563eb, #4f9eff);
    }

    .theme-select {
      margin-left: auto;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid light-dark(#d0d0d0, #4c4c4c);
      background: light-dark(#f8f8f8, #2d2d2d);
      color: inherit;
      font-size: 12px;
    }

    /* Studio container */
    #studio { flex: 1; min-height: 0; }

    .empty-state {
      padding: 20px;
      text-align: center;
      color: light-dark(#888, #666);
      font-size: 13px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: light-dark(#fff, #2d2d2d);
      border: 1px solid light-dark(#d0d0d0, #4c4c4c);
      border-radius: 8px;
      padding: 20px;
      min-width: 280px;
    }

    .modal h3 { margin-bottom: 12px; font-size: 15px; }

    .modal input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid light-dark(#d0d0d0, #4c4c4c);
      border-radius: 4px;
      background: light-dark(#f8f8f8, #1e1e1e);
      color: inherit;
      margin-bottom: 12px;
    }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .modal button {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid light-dark(#d0d0d0, #4c4c4c);
      background: light-dark(#f0f0f0, #3c3c3c);
      color: inherit;
      cursor: pointer;
    }

    .modal button.primary {
      background: light-dark(#2563eb, #4f9eff);
      border-color: light-dark(#2563eb, #4f9eff);
      color: white;
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      Files
      <button onclick="showNewFileModal()" title="New file">+</button>
    </div>
    <div class="file-list" id="file-list">
      <div class="empty-state">Loading...</div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <span class="logo">mrmd</span>
      <select class="theme-select" id="theme-select">
        <option value="">Auto</option>
        <option value="midnight">Midnight</option>
        <option value="daylight">Daylight</option>
        <option value="github">GitHub</option>
        <option value="nord">Nord</option>
      </select>
    </header>
    <div id="studio"></div>
  </main>
</div>

<!-- New File Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>New File</h3>
    <input type="text" id="new-file-name" placeholder="filename">
    <div class="modal-actions">
      <button onclick="hideModal()">Cancel</button>
      <button class="primary" onclick="createFile()">Create</button>
    </div>
  </div>
</div>

<script type="module">
  // Import shell components
  import { createStudio, OrchestratorClient } from '../dist/mrmd.esm.js';

  const API = 'http://localhost:8080';
  const orchestrator = new OrchestratorClient(API);

  let studio = null;
  let files = [];

  // =========================================================================
  // File List (sidebar)
  // =========================================================================

  async function loadFiles() {
    try {
      const result = await orchestrator.listFiles();
      files = result.files || [];
      renderFiles();
    } catch (e) {
      document.getElementById('file-list').innerHTML =
        '<div class="empty-state">Failed to load</div>';
    }
  }

  function renderFiles() {
    const list = document.getElementById('file-list');
    const current = studio?.currentDocument;

    if (files.length === 0) {
      list.innerHTML = '<div class="empty-state">No files yet</div>';
      return;
    }

    list.innerHTML = files.map(f => `
      <div class="file-item ${f.name === current ? 'active' : ''}"
           onclick="openFile('${f.name}')">
        <span>📄</span>
        <span>${f.name}</span>
      </div>
    `).join('');
  }

  // =========================================================================
  // Studio (editor + status bar)
  // =========================================================================

  async function initStudio(initialDoc) {
    const themeSelect = document.getElementById('theme-select');

    studio = await createStudio('#studio', {
      orchestratorUrl: API,
      document: initialDoc,
      editorOptions: {
        theme: themeSelect.value || null,
        cellControls: { enabled: true },
      },
      statusBar: {
        segments: ['files', 'sync', 'runtime'],
        position: 'bottom',
      },
    });

    // Listen for file changes to update sidebar
    studio.on('fileOpened', () => renderFiles());

    // Theme selector
    themeSelect.addEventListener('change', (e) => {
      studio.editor.setTheme(e.target.value || null);
    });
  }

  // Open file via Studio (handles destroy+recreate safely)
  window.openFile = async (name) => {
    if (!studio) {
      await initStudio(name);
    } else {
      await studio.openFile(name);
    }
    renderFiles();
  };

  // =========================================================================
  // New File Modal
  // =========================================================================

  window.showNewFileModal = () => {
    document.getElementById('modal').style.display = 'flex';
    const input = document.getElementById('new-file-name');
    input.value = '';
    input.focus();
  };

  window.hideModal = () => {
    document.getElementById('modal').style.display = 'none';
  };

  window.createFile = async () => {
    const name = document.getElementById('new-file-name').value.trim();
    if (!name) return;

    hideModal();
    try {
      await orchestrator.createFile(name);
      await loadFiles();
      openFile(name);
    } catch (e) {
      alert('Failed to create file: ' + e.message);
    }
  };

  document.getElementById('new-file-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') createFile();
    if (e.key === 'Escape') hideModal();
  });

  // =========================================================================
  // Init
  // =========================================================================

  async function init() {
    await loadFiles();

    // Auto-open first file if available
    if (files.length > 0) {
      await initStudio(files[0].name);
      renderFiles();
    }
  }

  init();
</script>

</body>
</html>
