<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mrmd - Minimal Full Stack</title>
  <style>
    body { margin: 0; height: 100vh; }
    #editor { height: 100%; }
  </style>
</head>
<body>

<div id="editor"></div>

<script src="../dist/mrmd.iife.js"></script>
<script type="module">
  const doc = `# Minimal Full Stack Demo

This is mrmd with **all defaults** - no custom styling.

## JavaScript (with Runtime LSP!)

Run this cell first, then **hover** over \`items\` or \`data\` to see actual values:

\`\`\`javascript
const items = ["apple", "banana", "cherry"];
const data = { count: items.length, first: items[0] };
console.log("Items:", items.join(", "));
data
\`\`\`

After running, try typing \`data.\` to see **runtime completions** (actual properties, not guesses).

## Python (if mrmd-python is running)

\`\`\`python
import math
x = 42
print(f"The answer is {x}")
math.sqrt(x)
\`\`\`

---

**Cell Controls** (buttons next to code cells):
- **Play button**: Click to run the cell (adds to queue)
- **Stop button**: Cancel running/queued execution
- **Copy button**: Copy code to clipboard
- **Clear button**: Remove output

**Queue Status**: When multiple cells are queued, you'll see position indicators like \`2/3\`.

**Runtime LSP Features:**
- **Hover**: Shows actual values (\`items = ["apple", "banana", "cherry"]\`)
- **Completions**: Type \`data.\` after running to see real properties
- **Variables**: Check \`editor.listVariables()\` in console

Press **Shift+Enter** to run a code cell, or click the **play button**.
`;

  // Connect to sync server (auto-fallback to local if server not running)
  const docs = mrmd.drive('ws://localhost:4444');

  // Open document with dev panel enabled
  // JavaScript runtime is built-in automatically
  const editor = await docs.open('minimal-demo', '#editor', {
    doc,
    dark: true,
    devPanel: {
      enabled: true,
      startOpen: true,
      maxHeight: 300
    },
    // Cell controls: run buttons, queue status, copy buttons
    // All enabled by default - showing explicit config for reference
    cellControls: {
      enabled: true,
      position: 'line-start',  // 'line-start' | 'line-end' | 'gutter' | 'none'
      buttons: {
        run: true,        // Play button
        stop: true,       // Stop/cancel button (shown when running/queued)
        clear: true,      // Clear output button
        copy: true,       // Copy code button
        copyOutput: true, // Copy output button
        copyBoth: true,   // Copy code + output (off by default, enabling for demo)
      },
      status: {
        show: true,              // Show status indicator
        showQueuePosition: true, // Show "2/3" in queue
        statusLineInOutput: true // Add [status:queued] lines to output
      },
      queue: {
        mode: 'sequential'  // FIFO execution like Jupyter
      }
    }
  });

  // Python: connect to MRP server with full features (execution + hover + completions)
  editor.connectRuntime('python', 'http://localhost:8000/mrp/v1');

  // Keyboard shortcuts are built-in:
  // - Shift+Enter: Run cell and advance to next
  // - Mod+Enter: Run cell and stay
  // - Alt+Arrow: Navigate between cells
  // Customize with: editor.setKeymap({ 'F5': 'runAllCells' })

  // Subscribe to state changes for debugging
  editor.onStateChange((event) => {
    if (event.path.startsWith('execution') || event.path.startsWith('history')) {
      console.log('State:', event.path, event.value);
    }
  });

  // Expose for debugging
  window.editor = editor;
  window.mrmd = mrmd;

  console.log('Editor ready! Access via window.editor');
  console.log('Try: editor.config, editor.state, editor.commands');
  console.log('Keymaps: editor.getKeymap(), editor.setKeymap({ "F5": "runAllCells" })');
  console.log('Runtime LSP: editor.listVariables(), editor.getHoverInfo()');
  console.log('Cell Controls: editor.cellControls.runCell(0), editor.cellControls.getQueueSnapshot()');
  console.log('Shift+Enter to run and advance, Mod+Enter to run and stay');
  console.log('Click the play button next to code cells to run them!');
</script>

</body>
</html>
